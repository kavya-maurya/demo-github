<section class="page tasks-page">
  <div class="page-header">
    <h1>Tasks</h1>
    <button class="primary-button" (click)="goToAddTask()">Add Task</button>
  </div>

  <p *ngIf="message" class="message">{{ message }}</p>

  <div *ngIf="loading" class="empty-state">Loading tasks...</div>

  <div *ngIf="!loading && tasks.length === 0" class="empty-state">
    No tasks available yet. Add your first task.
  </div>

  <div *ngIf="tasks.length > 0" class="task-list">
    <article class="task-card" *ngFor="let task of tasks">
      <h2>{{ task.title }}</h2>
      <p><strong>Description:</strong> {{ task.description || 'No description provided.' }}</p>
      <p><strong>Status:</strong> {{ task.status || 'pending' }}</p>

      <div class="task-actions">
        <button class="secondary-button" [routerLink]="['/tasks/edit', task._id]">Edit</button>
        <button class="danger-button" (click)="deleteTask(task._id)">Delete</button>
      </div>
    </article>
  </div>
</section>
